services:
  - type: web
    name: meridian-crm-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: meridian-crm-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false # set this to your deployed Vercel URL after the first deploy
      - key: ANTHROPIC_API_KEY
        sync: false # optional — leave unset to disable AI lead scoring

databases:
  - name: meridian-crm-db
    plan: free
